CONFIG_LOG_DEFAULT_LEVEL=3

# Devicetree enables Cirque + PS/2 listeners on this half; Kconfig must pull in the
# matching drivers or linking fails with undefined __device_dts_ord_* in input_listener.c.
# PS/2: do not set CONFIG_ZMK_INPUT_MOUSE_PS2 - it has no Kconfig prompt and is enabled
# automatically when the zmk,input-mouse-ps2 node is status "okay" (see mouse_tp.dtsi).
CONFIG_I2C=y
CONFIG_INPUT_PINNACLE=y
