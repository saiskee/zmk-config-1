manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: saiskee
      url-base: https://github.com/saiskee
    - name: petejohanson
      url-base: https://github.com/petejohanson
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.2.1
      import: app/west.yml
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      # remote: saiskee # small movement detector
      remote: infused-kim
      revision: main
    # Cirque: vendored under modules/cirque-input-module (polling patch). Pass
    # -DZMK_EXTRA_MODULES to point at it (see build.yaml / local build notes).
  self:
    path: config
